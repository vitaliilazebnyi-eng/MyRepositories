<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Книгарня — ПЗ12</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #333;
        }
        h1, h2 {
            color: #222;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .filter-box, .form-box {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .form-row {
            margin-bottom: 10px;
        }
        .form-row label {
            display: inline-block;
            width: 140px;
            font-weight: bold;
        }
        .form-row input, .form-row textarea {
            width: 300px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        button {
            padding: 6px 12px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0052a3;
        }
        button.delete-btn {
            background-color: #cc0000;
        }
        button.delete-btn:hover {
            background-color: #a30000;
        }
        button.cancel-btn {
            background-color: #777;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px 10px;
            text-align: left;
        }
        th {
            background-color: #eaeaea;
        }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
        .msg {
            margin-bottom: 15px;
            padding: 10px;
            display: none;
        }
        .msg-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .msg-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Управління книгарнею (ПЗ12)</h1>

    <div id="messageBox" class="msg"></div>

    <!-- Форма фільтрації -->
    <div class="filter-box">
        <strong>Фільтрація:</strong>
        <label for="filterGenre" style="margin-left: 10px;">Жанр:</label>
        <input type="text" id="filterGenre" placeholder="напр. Поезія">
        <button onclick="loadBooks()">Пошук</button>
        <button style="background-color: #666;" onclick="resetFilter()">Скинути</button>
    </div>

    <!-- Форма додавання / редагування книги -->
    <div class="form-box">
        <h2 id="formTitle">Додати книгу</h2>
        <form id="bookForm" onsubmit="saveBook(event)">
            <input type="hidden" id="bookId">

            <div class="form-row">
                <label for="title">Назва:*</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-row">
                <label for="author">Автор:*</label>
                <input type="text" id="author" required>
            </div>
            <div class="form-row">
                <label for="genre">Жанр:</label>
                <input type="text" id="genre" placeholder="напр. Повість">
            </div>
            <div class="form-row">
                <label for="price">Ціна (грн):*</label>
                <input type="number" step="0.01" min="0" id="price" required>
            </div>
            <div class="form-row">
                <label for="year">Рік:</label>
                <input type="number" id="year">
            </div>
            <div class="form-row">
                <label for="coverUrl">Обкладинка (URL):</label>
                <input type="text" id="coverUrl" value="/covers/kobzar.svg">
            </div>
            <div class="form-row">
                <label for="description">Опис:</label>
                <textarea id="description" rows="2"></textarea>
            </div>

            <div style="margin-top: 15px;">
                <button type="submit" id="submitBtn">Зберегти</button>
                <button type="button" id="cancelBtn" class="cancel-btn" style="display:none;" onclick="cancelEdit()">Скасувати</button>
            </div>
        </form>
    </div>

    <!-- Таблиця книг -->
    <h2>Список книг</h2>
    <table>
        <thead>
            <tr>
                <th style="width: 40px;">ID</th>
                <th style="width: 60px;">Обкладинка</th>
                <th>Назва</th>
                <th>Автор</th>
                <th>Ціна</th>
                <th style="width: 170px;">Дії</th>
            </tr>
        </thead>
        <tbody id="booksTableBody">
            <tr>
                <td colspan="6" style="text-align:center;">Завантаження...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const API = '/api/books';

    window.onload = function() {
        loadBooks();
    };

    function showMsg(text, isError = false) {
        const box = document.getElementById('messageBox');
        box.textContent = text;
        box.className = 'msg ' + (isError ? 'msg-error' : 'msg-success');
        box.style.display = 'block';
        setTimeout(() => {
            box.style.display = 'none';
        }, 4000);
    }

    // Завантажити перелік книг (з фільтром або без)
    function loadBooks() {
        const genre = document.getElementById('filterGenre').value.trim();
        let url = API;
        if (genre) {
            url += '?genre=' + encodeURIComponent(genre);
        }

        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error('Помилка сервера: ' + res.status);
                return res.json();
            })
            .then(books => {
                const tbody = document.getElementById('booksTableBody');
                tbody.innerHTML = '';

                if (books.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Книг не знайдено</td></tr>';
                    return;
                }

                books.forEach(b => {
                    const row = document.createElement('tr');
                    const cover = b.coverUrl 
                        ? `<img src="${b.coverUrl}" alt="Обкладинка" style="height: 48px; width: 34px; object-fit: contain; border: 1px solid #ccc; background: #fff;" onerror="this.style.display='none'">` 
                        : '—';

                    row.innerHTML = `
                        <td>${b.id}</td>
                        <td style="text-align: center;">${cover}</td>
                        <td><strong>${escape(b.title)}</strong></td>
                        <td>${escape(b.author)}</td>
                        <td>${Number(b.price).toFixed(2)} грн</td>
                        <td>
                            <button onclick="editBook(${b.id})">Редагувати</button>
                            <button class="delete-btn" onclick="deleteBook(${b.id})">Видалити</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(err => {
                showMsg(err.message, true);
            });
    }

    function resetFilter() {
        document.getElementById('filterGenre').value = '';
        loadBooks();
    }

    // Зберегти (POST або PUT)
    function saveBook(e) {
        e.preventDefault();

        const id = document.getElementById('bookId').value;
        const data = {
            title: document.getElementById('title').value.trim(),
            author: document.getElementById('author').value.trim(),
            genre: document.getElementById('genre').value.trim() || null,
            price: parseFloat(document.getElementById('price').value),
            year: document.getElementById('year').value ? parseInt(document.getElementById('year').value) : null,
            coverUrl: document.getElementById('coverUrl').value.trim() || '/covers/kobzar.svg',
            description: document.getElementById('description').value.trim() || null
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? (API + '/' + id) : API;

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(res => {
            if (!res.ok) throw new Error('Помилка запиту: ' + res.status);
            return res.json();
        })
        .then(saved => {
            showMsg(id ? 'Книгу оновлено!' : 'Книгу успішно додано!');
            cancelEdit();
            loadBooks();
        })
        .catch(err => {
            showMsg(err.message, true);
        });
    }

    // Завантажити книгу у форму для редагування
    function editBook(id) {
        fetch(API + '/' + id)
            .then(res => {
                if (!res.ok) throw new Error('Не знайдено книгу');
                return res.json();
            })
            .then(b => {
                document.getElementById('formTitle').textContent = 'Редагувати книгу #' + b.id;
                document.getElementById('bookId').value = b.id;
                document.getElementById('title').value = b.title || '';
                document.getElementById('author').value = b.author || '';
                document.getElementById('genre').value = b.genre || '';
                document.getElementById('price').value = b.price || '';
                document.getElementById('year').value = b.year || '';
                document.getElementById('coverUrl').value = b.coverUrl || '';
                document.getElementById('description').value = b.description || '';

                document.getElementById('cancelBtn').style.display = 'inline-block';
                document.getElementById('submitBtn').textContent = 'Зберегти зміни';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            })
            .catch(err => {
                showMsg(err.message, true);
            });
    }

    function cancelEdit() {
        document.getElementById('formTitle').textContent = 'Додати книгу';
        document.getElementById('bookForm').reset();
        document.getElementById('bookId').value = '';
        document.getElementById('coverUrl').value = '/covers/kobzar.svg';
        document.getElementById('cancelBtn').style.display = 'none';
        document.getElementById('submitBtn').textContent = 'Зберегти';
    }

    // Видалення книги
    function deleteBook(id) {
        if (!confirm('Видалити книгу з ID ' + id + '?')) {
            return;
        }

        fetch(API + '/' + id, { method: 'DELETE' })
            .then(res => {
                if (res.status === 204) {
                    showMsg('Книгу #' + id + ' видалено.');
                    loadBooks();
                } else if (res.status === 404) {
                    showMsg('Книгу не знайдено (404)', true);
                    loadBooks();
                } else {
                    throw new Error('Помилка: ' + res.status);
                }
            })
            .catch(err => {
                showMsg(err.message, true);
            });
    }

    function escape(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }
</script>

</body>
</html>
